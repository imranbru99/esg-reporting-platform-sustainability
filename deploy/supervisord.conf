[supervisord]
nodaemon=false

[program:esg-horizon]
process_name=%(program_name)s
command=php /var/www/esg-platform/artisan horizon
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/esg-platform/storage/logs/horizon.log
stopwaitsecs=3600

[program:esg-reverb]
process_name=%(program_name)s
command=php /var/www/esg-platform/artisan reverb:start --port=8080
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/esg-platform/storage/logs/reverb.log

